name: Windows PowerShell validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Markdown TOC filter regression
        shell: powershell
        run: node --test Tests/MarkdownToc.Tests.mjs
      - name: Committed README table of contents matches its headings
        shell: powershell
        run: node Scripts/MarkdownToc.mjs check
      - name: Parse all scripts with Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem -Recurse -File | Where-Object { $_.Extension -in '.ps1', '.psm1' } | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors) { throw ($errors | Out-String) }
            $bytes = [IO.File]::ReadAllBytes($_.FullName)
            if ($bytes[0] -ne 239 -or $bytes[1] -ne 187 -or $bytes[2] -ne 191) { throw "Missing UTF-8 BOM: $($_.Name)" }
          }
      - name: Core behavior
        shell: powershell
        run: .\Tests\Core.Tests.ps1
      - name: Independent package contents and orchestration
        shell: powershell
        run: .\Tests\Architecture.Tests.ps1
      - name: Selection panel layout, confirmation gates, and package plans
        shell: powershell
        run: .\Tests\SelectionPanel.Tests.ps1
      - name: GUI worker streaming, transaction states, and hidden launchers
        shell: powershell
        run: .\Tests\ManagementExecution.Tests.ps1
      - name: Failed status full log terminal data boundary
        shell: powershell
        run: .\Tests\ManagementLogTerminal.Tests.ps1
      - name: Flutter leaf selection and legacy state compatibility
        shell: powershell
        run: .\Tests\FlutterFeatureSelection.Tests.ps1
      - name: Unified Flutter package and dispatch guards
        shell: powershell
        run: .\Tests\FlutterTools.Tests.ps1
      - name: Flutter setup compatibility, Wrapper cache and live milestone protocol
        shell: powershell
        run: |
          .\Tests\FlutterProjectSetup.Tests.ps1
          .\Tests\FlutterProjectSetupDashboard.Tests.ps1
          .\Tests\FlutterProjectSetupLogTail.Tests.ps1
          .\Tests\FlutterProjectSetupVersion.Tests.ps1
      - name: Build selected Flutter native menu with MSVC
        shell: powershell
        run: |
          .\JobsFlutterTools\Scripts\Build.ps1 `
            -SourceRoot (Join-Path $PWD 'JobsFlutterTools') `
            -OutputRoot (Join-Path $env:RUNNER_TEMP 'JobsFlutterTools-native')
      - name: Infrastructure copies stay in sync
        shell: powershell
        run: .\Scripts\Sync-PackageInfrastructure.ps1
      - name: Per-package registry commands
        shell: powershell
        run: .\Tests\Installer.Tests.ps1
      - name: Isolated package registry transactions
        shell: powershell
        run: .\Tests\PackageInstaller.Tests.ps1
      - name: Independent business module entry points
        shell: powershell
        run: .\Tests\ActionModules.Tests.ps1
      - name: Windows PowerShell 5.1 catalog compatibility
        shell: powershell
        run: .\Tests\Catalog.Tests.ps1
      - name: Terminal package guardrails and command transport
        shell: powershell
        run: .\Tests\Worker.Tests.ps1
      - name: Flutter SDK inspection and version constraint guardrails
        shell: powershell
        run: .\Tests\FlutterSdkInspector.Tests.ps1
      - name: Flutter FVM project and offline selection guardrails
        shell: powershell
        run: .\Tests\FlutterVersionMgr.Tests.ps1
      - name: OpenHarmony Flutter SDK pinning and project-only publication
        shell: powershell
        run: .\Tests\HarmonyFlutterSdk.Tests.ps1
      - name: Git pull snapshots and conflict choices against temporary bare remotes
        shell: powershell
        run: .\Tests\GitPuller.Tests.ps1
      - name: Git rollback native menu, metadata gate, UTF8 transport and isolated resets
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $nativeOutput = Join-Path $env:RUNNER_TEMP 'JobsGitRollback-native'
          # Dot-source retains the same discovered MSVC environment for the two test-only executables.
          . .\JobsGitRollback\Scripts\Build.ps1 `
            -SourceRoot (Join-Path $PWD 'JobsGitRollback') `
            -OutputRoot $nativeOutput
          foreach ($probeName in @('GitRollbackMetadataProbe', 'GitRollbackFzfProbe', 'RunPermissionMenuProbe', 'HiddenFilesMenuProbe', 'IDEProjectMenuProbe', 'SourcetreeInstallationProbe', 'FileViewerMenuProbe', 'FileVolumesMenuProbe')) {
            $probeSource = Join-Path $PWD ('Tests/' + $probeName + '.cpp')
            $probeExecutable = Join-Path $nativeOutput ($probeName + '.exe')
            $probeObject = Join-Path $nativeOutput ($probeName + '.obj')
            $probeStart = New-Object Diagnostics.ProcessStartInfo
            $probeStart.FileName = $compiler
            $probeStart.Arguments = '/nologo /MT /EHsc /std:c++14 /utf-8 /W4 /Fo"' + $probeObject + '" /Fe"' + $probeExecutable + '" "' + $probeSource + '"'
            $probeStart.WorkingDirectory = $nativeOutput
            $probeStart.UseShellExecute = $false
            foreach ($key in $buildEnvironment.Keys) { $probeStart.EnvironmentVariables[$key] = $buildEnvironment[$key] }
            $probeProcess = [Diagnostics.Process]::Start($probeStart)
            try {
              if (-not $probeProcess.WaitForExit(60000)) { $probeProcess.Kill(); throw 'Native Git rollback probe build timed out.' }
              if ($probeProcess.ExitCode -ne 0) { throw ('Native Git rollback probe build failed: ' + $probeName) }
            } finally { $probeProcess.Dispose() }
          }
          & (Join-Path $nativeOutput 'GitRollbackMetadataProbe.exe')
          if ($LASTEXITCODE -ne 0) { throw 'Git metadata probe failed.' }
          & (Join-Path $nativeOutput 'RunPermissionMenuProbe.exe')
          if ($LASTEXITCODE -ne 0) { throw 'Run permission menu probe failed.' }
          & (Join-Path $nativeOutput 'HiddenFilesMenuProbe.exe')
          if ($LASTEXITCODE -ne 0) { throw 'Hidden files menu probe failed.' }
          & (Join-Path $nativeOutput 'IDEProjectMenuProbe.exe')
          if ($LASTEXITCODE -ne 0) { throw 'IDE project menu probe failed.' }
          & (Join-Path $nativeOutput 'SourcetreeInstallationProbe.exe')
          if ($LASTEXITCODE -ne 0) { throw 'Sourcetree installation probe failed.' }
          & (Join-Path $nativeOutput 'FileVolumesMenuProbe.exe')
          if ($LASTEXITCODE -ne 0) { throw 'FileVolumesMenuProbe failed' }
          & (Join-Path $nativeOutput 'FileViewerMenuProbe.exe')
          if ($LASTEXITCODE -ne 0) { throw 'File viewer menu probe failed.' }
          .\Tests\GitRollback.Tests.ps1 -FzfProbeExecutable (Join-Path $nativeOutput 'GitRollbackFzfProbe.exe')
      - name: Flutter dependency import validation and confirmation guards
        shell: powershell
        run: .\Tests\FlutterDependencyImporter.Tests.ps1
      - name: Flutter dependency extraction guards and native argument transport
        shell: powershell
        run: .\Tests\FlutterDependencyExtractor.Tests.ps1
      - name: Flutter runner project, lifecycle, and native build guards
        shell: powershell
        run: .\Tests\FlutterRunner.Tests.ps1
      - name: Flutter packaging selection, SDK, failure, and artifact guards
        shell: powershell
        run: |
          .\Tests\FlutterPackager.Tests.ps1
          .\Tests\FlutterHarmonyPackage.Tests.ps1
      - name: Flutter doctor and configured codegen guardrails
        shell: powershell
        run: .\Tests\FlutterDoctorCodegen.Tests.ps1
      - name: Android simulator desktop, SDK, and creation guardrails
        shell: powershell
        run: .\Tests\AndroidSimulatorCreator.Tests.ps1
      - name: Android simulator SDK repair and same-volume staging
        shell: powershell
        run: .\Tests\AndroidSimulatorRepair.Tests.ps1
      - name: Android emulator storage diagnosis and guarded repairs
        shell: powershell
        run: .\Tests\AndroidSimulatorRepairer.Tests.ps1
      - name: Build standalone Android repair desktop handler with MSVC
        shell: powershell
        run: |
          .\JobsAndroidSimulatorRepairer\Scripts\Build.ps1 `
            -SourceRoot (Join-Path $PWD 'JobsAndroidSimulatorRepairer') `
            -OutputRoot (Join-Path $env:RUNNER_TEMP 'JobsAndroidSimulatorRepairer-native')
      - name: Git dynamic proxy desktop, routing and exact user restore
        shell: powershell
        run: .\Tests\GitProxyConfigurator.Tests.ps1
      - name: Android simulator automatic Java and dependency bootstrap
        shell: powershell
        run: .\Tests\AndroidSimulatorBootstrap.Tests.ps1
      - name: Harmony simulator desktop and installed-image creation guardrails
        shell: powershell
        run: .\Tests\HarmonySimulatorCreator.Tests.ps1
      - name: Harmony emulator identity and coldboot repair
        shell: powershell
        run: .\Tests\HarmonySimulatorRepairer.Tests.ps1
      - name: Current user single-file ExecuteFile grant and revoke
        shell: powershell
        run: .\Tests\RunPermissions.Tests.ps1
      - name: Dynamic desktop hidden-file state and isolated preference toggles
        shell: powershell
        run: .\Tests\HiddenFiles.Tests.ps1
      - name: IDE nonempty and project-type eligibility
        shell: powershell
        run: .\Tests\IDEProject.Tests.ps1
      - name: Build dynamic handlers with MSVC
        shell: powershell
        run: |
          foreach ($name in @('JobsHarmonySimulatorRepairer', 'JobsRunAuthorizer', 'JobsRunAuthorizationRevoker', 'JobsHiddenFilesToggler', 'JobsAndroidStudioOpener', 'JobsVSCodeOpener', 'JobsSourcetreeOpener', 'JobsFileContentViewer', 'JobsFileVolumes')) {
            & (Join-Path $PWD ($name + '/Scripts/Build.ps1')) -SourceRoot (Join-Path $PWD $name) -OutputRoot (Join-Path $env:RUNNER_TEMP ($name + '-native'))
          }
      - name: Sourcetree installation visibility and nearest Git repository
        shell: powershell
        run: .\Tests\SourcetreeOpener.Tests.ps1

      - name: File viewer thresholds, Unicode and bounded terminal output
        shell: powershell
        run: .\Tests\FileContentViewer.Tests.ps1

      - name: Exact-selection file volumes and safe streaming roundtrip
        shell: powershell
        run: .\Tests\FileVolumes.Tests.ps1
